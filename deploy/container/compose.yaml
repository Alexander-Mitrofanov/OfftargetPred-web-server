# Run from this directory; first set OFFTARGET_SOURCE_REVISION and OFFTARGET_MODELS.
name: offtargetpred-local
services:
  api:
    image: offtargetpred-local:${OFFTARGET_SOURCE_REVISION:?Set the tested source revision}
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      args:
        SOURCE_REVISION: ${OFFTARGET_SOURCE_REVISION:?Set the tested source revision}
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      OFFTARGET_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    volumes:
      - jobs:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 128
    restart: unless-stopped
  worker:
    image: offtargetpred-local:${OFFTARGET_SOURCE_REVISION:?Set the tested source revision}
    command: [python, -m, offtargetpred.worker]
    network_mode: none
    volumes:
      - jobs:/data
      - ${OFFTARGET_MODELS:?Set absolute directory containing k1 k2 k3}:/models:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 8g
    cpus: 4
    pids_limit: 128
    restart: unless-stopped
volumes:
  jobs:
